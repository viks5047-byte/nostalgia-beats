<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostalgia Beats</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Yatra+One&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            background-color: #0b0b0b;
        }

        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -2;
        }

        #bg-day {
            background-image: url('kolkata.png');
            opacity: 1;
        }

        #bg-night {
            background-image: url('kolkatanight.png');
            opacity: 0;
        }

        body.dark-mode #bg-day {
            opacity: 0;
        }

        body.dark-mode #bg-night {
            opacity: 1;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0);
            pointer-events: none;
            transition: background 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -1;
        }
        body.dark-mode::before {
            background: rgba(10, 10, 20, 0.55);
        }

        #yt-player-container {
            position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; z-index: -10;
        }

        .top-nav {
            display: flex; justify-content: flex-end; align-items: center;
            padding: 20px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
            z-index: 2;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .theme-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .theme-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 28px;
        }
